    <!--
      THESIS: A backend read on a CRT bench scope — every value measured per division
      against a graticule whose timebase you set. Refuses the glass-metric-card
      observability dashboard, and refuses the dark page with one neon accent that
      merely quotes this world instead of building it.
      OWN-WORLD: Matte instrument panel #10150F over chassis #080B09; a single P31
      phosphor on #050806 CRT glass, so channels separate by trace position and
      intensity, never by hue; amber #FFB000 armed, #FF7A38 fault; hairline fieldset
      enclosures with nomenclature legends breaking the border; authored seven-segment
      readouts with visible unlit segments; detented rotary controls; square corners.
      STORY: A stakeholder sees two live signals sweeping a real graticule, real
      records listed, a real probe including its 404 envelope, and layered enforced
      boundaries — and trusts the engineering without reading the source.
      FIRST VIEWPORT: Top bezel carries the dot-matrix wordmark and four readout boxes
      (CH1 round-trip, CH2 heap, TIMEBASE, TRIGGER). Beneath, a 10x8 etched graticule
      fills the stage with CH1 traced bright across the upper five divisions and CH2
      dimmer across the lower three, phosphor persistence decaying between reads; the
      TIME/DIV knob and four seven-segment readouts sit on the panel below it.
      FORM: CRT oscilloscope on a signal bench; user-chosen challenger over assigned
      candidate 5; seed 59fc63bf.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->
